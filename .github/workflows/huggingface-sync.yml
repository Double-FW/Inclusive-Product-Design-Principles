name: Sync Inclusive Product Design Principles dataset

on:
  push:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "LICENSE"
      - "Dieter_Rams_Digital_Product_Design_Principles_Multimodal.md"
      - "Dieter_Rams_Indifference_Cardinal_Sin_Design.md"
      - "Nonvisual_User_Expectations_Needs_Preferences_and_Outcomes.md"
      - "POUR_Brand_Experience_Outcomes_Nonvisual_Perspective.md"
      - "POUR_Brand_Experience_Outcomes_Sighted_Perspective.md"
      - "Principles_First_Person_Sighted_Perspective.md"
      - "UX_Practice_From_Principles_to_People.md"
      - "huggingface/export-config.json"
      - "huggingface/requirements.txt"
      - "huggingface/SETUP.md"
      - "scripts/sync_huggingface.py"
      - ".github/workflows/huggingface-sync.yml"
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inclusive-product-design-principles-huggingface-sync
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Double-FW/Inclusive-Product-Design-Principles' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_DATASET_ID: GarethFW/Inclusive_Product_Design_Principles
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install publishing dependency
        run: python -m pip install -r huggingface/requirements.txt
      - name: Validate the curated export
        run: python scripts/sync_huggingface.py --mode check --dataset-id "$HF_DATASET_ID"
      - name: Build dataset files
        run: python scripts/sync_huggingface.py --mode build --output "$RUNNER_TEMP/inclusive-product-design-principles-dataset" --dataset-id "$HF_DATASET_ID"
      - name: Publish to the existing dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/sync_huggingface.py --mode publish --folder "$RUNNER_TEMP/inclusive-product-design-principles-dataset" --dataset-id "$HF_DATASET_ID"
